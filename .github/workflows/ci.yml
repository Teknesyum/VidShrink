name: ci

# Build and test on every branch push and on every pull request. Agent branches were
# invisible here until now: the trigger only listened to main, so "check CI before you
# push" could never be satisfied on a working branch. The release workflow runs the same
# gate, but only when a tag is pushed; without this one a break reaches main and is not
# seen until release day.

on:
  push:
    branches: ["**"]
    # Relay bookkeeping (contracts, LOG, task packets) lands on main between code
    # merges. Those commits cannot break the build, but each one started a run that
    # cancelled the code run still in flight, so main went hours without a green
    # reading. Paths that cannot affect the build no longer trigger one.
    paths-ignore:
      - ".claude/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  test:
    # Same reason as the release gate: the measurement suite opens real Avalonia windows.
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # [FfmpegFact] covers ~80 measures across 11 files: the engine's own probe, encode,
      # scene-map and quality-meter tests. Without ffmpeg on PATH they silently skip, so
      # the runner never sees them. Pinned to a GitHub Release asset (immutable, unlike
      # windows-latest's own drift or a rolling "latest" build tag) and checked against a
      # recorded sha256 so a corrupted or replaced download fails the step instead of
      # installing something untested.
      # This installs ffmpeg onto the CI runner to execute tests, which is not distribution
      # of the built application; the release itself still ships without ffmpeg (see the
      # GPLv3/AGPL-3.0-or-later note at the top of release.yml).
      - name: ffmpeg kur (GyanD/codexffmpeg surum 9.0, yerelde kullanilanla ayni)
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/GyanD/codexffmpeg/releases/download/9.0/ffmpeg-9.0-full_build.zip'
          $expectedSha256 = 'F42F0C4B04EAE3AC918707FF66E3E0FF0CEE527BFA6D322624D4BC1160D5055E'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'

          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($actual -ne $expectedSha256) {
            Write-Error "ffmpeg indirmesi sha256 uyusmuyor: beklenen=$expectedSha256 gelen=$actual"
            exit 1
          }

          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          $bin = Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0-full_build\bin'
          if (-not (Test-Path (Join-Path $bin 'ffmpeg.exe')) -or -not (Test-Path (Join-Path $bin 'ffprobe.exe'))) {
            Write-Error "ffmpeg.exe/ffprobe.exe beklenen yolda yok: $bin"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: libmpv kur (shinchiro mpv-winbuild-cmake 20260903, sabit sha256)
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260903/mpv-dev-x86_64-20260903-git-69e63f425a.7z'
          $expectedSha256 = 'FAC135C68A35B7639E39D72C0C365104EDBAEBDEA39A0DFDD8C36E8C8E80FAEF'
          $expectedDllSha256 = '673E6397920AB64A9C5B3A618F7F16D38854EFE72B58665F1F84E4E873B763A4'
          $archive = Join-Path $env:RUNNER_TEMP 'mpv-dev.7z'

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash
          if ($actual -ne $expectedSha256) {
            Write-Error "libmpv indirmesi sha256 uyusmuyor: beklenen=$expectedSha256 gelen=$actual"
            exit 1
          }

          $dir = Join-Path $env:RUNNER_TEMP 'libmpv'
          7z x $archive "-o$dir" -y | Out-Null
          $dll = Join-Path $dir 'libmpv-2.dll'
          if (-not (Test-Path $dll)) {
            Write-Error "libmpv-2.dll beklenen yolda yok: $dll"
            exit 1
          }
          $dllActual = (Get-FileHash -Path $dll -Algorithm SHA256).Hash
          if ($dllActual -ne $expectedDllSha256) {
            Write-Error "libmpv-2.dll sha256 uyusmuyor: beklenen=$expectedDllSha256 gelen=$dllActual"
            exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "VIDSHRINK_LIBMPV=$dll"
      # Informational only: this does not fail the build. If a future version swap drops
      # libvmaf, the quality-meter measures should degrade to a counted, documented skip
      # (contract T115 K2), not a red install step — the install step above already
      # verified the binary it downloaded is the one it meant to.
      - name: ffmpeg surumu ve libvmaf filtresi
        run: |
          ffmpeg -version
          $filters = ffmpeg -hide_banner -filters 2>&1 | Out-String
          if ($filters -match 'libvmaf') {
            Write-Host "libvmaf filtresi var."
          } else {
            Write-Host "UYARI: libvmaf filtresi yok, kalite olcen testler atlanmaya devam edecek."
          }
      - run: dotnet build VidShrink.sln -c Release -warnaserror
      # A hung test host prints "Test host process crashed" with Failed: 0 and still
      # exits 0. -MinimumTotal reads the output and refuses a run that never finished.
      # -MaximumSkipped catches the other blind spot: Total stays the same when a test
      # silently flips from Passed to Skipped, so Total alone can't see it (T115 tur 2).
      - run: pwsh -File tools/kosum-kapisi/kosum-kapisi.ps1 -MinimumTotal 1143 -MaximumSkipped 30 -ResultsDir .calisma/kosum-sonuc

      # Kosum asilirsa blame'in aldigi hang dump buraya duser. Yukarilmazsa asilmanin
      # hangi is parcaciginda oldugu gorulemiyor; koda=65 kirmizisi sebepsiz kaliyor.
      - name: Kosum ciktisi ve hang dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosum-sonuc
          path: .calisma/kosum-sonuc/**
          if-no-files-found: ignore
          retention-days: 7
