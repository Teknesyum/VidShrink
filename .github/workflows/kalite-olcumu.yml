name: kalite-olcumu

on:
  push:
    tags: ['olcum-kalite-*']
  workflow_dispatch:
    inputs:
      kaynak_url:
        description: Acik kaynak video
        default: https://download.blender.org/durian/movies/Sintel.2010.1080p.mkv
      kaynak_sha256:
        description: Bos birakilirsa yazdirilir, doluysa dogrulanir
        default: ''
      ekran_url:
        description: Ekran kaydi kaynagi; bos ise ekran kesiti yok
        default: ''
      isler:
        description: Virgullu; whatsapp,handbrake,ceza,av1
        default: whatsapp,handbrake,ceza
      kesitler:
        description: Virgullu; karanlik,parlak,orta,hareketli,ekran
        default: karanlik,parlak,orta
      kbitler:
        description: HandBrake kiyasinin bit hizlari
        default: '600,2000'
      izgara:
        description: AV1 izgarasi JSON
        default: '{"preset":[4,6,8,10],"crf":[28,36,44],"kbit":[],"filmgrain":[0,8],"tune":[0,1],"keyint":[240]}'

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  BENCH: tools/VidShrink.Bench/bin/Release/net8.0/VidShrink.Bench.dll

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matris: ${{ steps.m.outputs.matris }}
    steps:
      - id: m
        shell: pwsh
        run: |
          $varsayilan = 'whatsapp,handbrake,ceza'
          $kesitVarsayilan = 'karanlik,parlak,orta'
          if ('${{ github.ref_name }}' -match '^olcum-kalite-([a-z0-9+]+)(?:__([a-z0-9+]+))?--') {
            $varsayilan = $Matches[1].Replace('+', ',')
            if ($Matches[2]) { $kesitVarsayilan = $Matches[2].Replace('+', ',') }
          }
          $isler = '${{ inputs.isler }}'
          if (-not $isler) { $isler = $varsayilan }
          $isler = $isler.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          $kesitler = '${{ inputs.kesitler }}'
          if (-not $kesitler) { $kesitler = $kesitVarsayilan }
          $kesitler = $kesitler.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          $liste = @()
          foreach ($is in $isler) {
            if ($is -eq 'whatsapp') { $liste += @{ is = $is; kesit = '' } }
            else { foreach ($k in $kesitler) { $liste += @{ is = $is; kesit = $k } } }
          }
          $json = ConvertTo-Json -Compress -InputObject @{ include = $liste }
          Write-Host $json
          "matris=$json" | Add-Content $env:GITHUB_OUTPUT

  kesit:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: ffmpeg kur
        run: pwsh tools/kalite-paketi-3/kur.ps1
      - name: kaynak indir
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $hedef = Join-Path $env:RUNNER_TEMP 'kaynak.mkv'
          Invoke-WebRequest -Uri '${{ inputs.kaynak_url || 'https://download.blender.org/durian/movies/Sintel.2010.1080p.mkv' }}' -OutFile $hedef
          $sha = (Get-FileHash $hedef -Algorithm SHA256).Hash
          "kaynak sha256=$sha boy=$((Get-Item $hedef).Length)" | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'kaynak-sha256.txt')
          $beklenen = '${{ inputs.kaynak_sha256 }}'
          if ($beklenen -and $beklenen.ToUpperInvariant() -ne $sha) { throw "kaynak sha256 uyusmuyor: $sha" }
          $ekran = '${{ inputs.ekran_url }}'
          if (-not $ekran -and '${{ github.ref_name }}' -match 'ekran') { $ekran = 'https://media.xiph.org/video/aomctc/test_set/b2_scc/Debugging_1920x1080_30fps_8bit_420.y4m' }
          if ($ekran) {
            $e = Join-Path $env:RUNNER_TEMP ('ekran' + [IO.Path]::GetExtension(([uri]$ekran).AbsolutePath))
            Invoke-WebRequest -Uri $ekran -OutFile $e
            "ekran sha256=$((Get-FileHash $e -Algorithm SHA256).Hash)" | Tee-Object -Append -FilePath (Join-Path $env:RUNNER_TEMP 'kaynak-sha256.txt')
          }
      - name: bench derle
        run: dotnet build tools/VidShrink.Bench -c Release -m:2
      - name: kesitleri sec
        run: |
          $a = @('-Is', 'kesit', '-Kaynak', "$env:RUNNER_TEMP\kaynak.mkv", '-Cikti', "$env:RUNNER_TEMP\olcum", '-Bench', $env:BENCH)
          $ekran = Get-ChildItem $env:RUNNER_TEMP -Filter 'ekran.*' | Select-Object -First 1
          if ($ekran) { $a += @('-EkranKaynak', $ekran.FullName) }
          pwsh tools/kalite-paketi-3/kos.ps1 @a
          Copy-Item "$env:RUNNER_TEMP\kaynak-sha256.txt" "$env:RUNNER_TEMP\olcum\"
      - uses: actions/upload-artifact@v4
        with:
          name: kesitler
          path: ${{ runner.temp }}/olcum
          compression-level: 0
          retention-days: 7

  olcum:
    needs: [plan, kesit]
    runs-on: windows-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matris) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: ffmpeg ve HandBrake kur
        run: pwsh tools/kalite-paketi-3/kur.ps1 -HandBrake
      - uses: actions/download-artifact@v4
        with:
          name: kesitler
          path: ${{ runner.temp }}/olcum
      - name: bench derle
        run: dotnet build tools/VidShrink.Bench -c Release -m:2
      - name: olc
        env:
          IZGARA: ${{ inputs.izgara || '{"preset":[4,6,8,10],"crf":[28,36,44],"kbit":[],"filmgrain":[0,8],"tune":[0,1],"keyint":[240]}' }}
          KBITLER: ${{ inputs.kbitler || '600,2000' }}
        run: |
          $a = @('-Is', '${{ matrix.is }}', '-Kaynak', 'kesitler', '-Cikti', "$env:RUNNER_TEMP\olcum", '-Bench', $env:BENCH, '-HandBrake', $env:HANDBRAKE_CLI, '-Kbitler', $env:KBITLER, '-Izgara', $env:IZGARA)
          if ('${{ matrix.kesit }}') { $a += @('-Kesit', '${{ matrix.kesit }}') }
          pwsh tools/kalite-paketi-3/kos.ps1 @a
      - name: sonuclari ayir
        if: always()
        run: |
          $d = Join-Path $env:RUNNER_TEMP 'sonuc'
          New-Item -ItemType Directory -Force $d | Out-Null
          Get-ChildItem "$env:RUNNER_TEMP\olcum" -Recurse -Include *.json, *.log, *.txt |
            ForEach-Object { Copy-Item $_.FullName (Join-Path $d (($_.FullName.Substring("$env:RUNNER_TEMP\olcum".Length + 1)) -replace '[\\/]', '__')) }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonuc-${{ matrix.is }}-${{ matrix.kesit || 'hepsi' }}
          path: ${{ runner.temp }}/sonuc
          retention-days: 30
