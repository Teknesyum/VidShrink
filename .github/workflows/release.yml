name: release

# Runs when a version tag is pushed. Publishes VidShrink self-contained for the six
# supported targets, writes a per-file manifest next to each archive, and collects
# everything into a GitHub Release, published as latest once every asset is uploaded.
# win-x64 additionally carries the launcher as
# vidshrink-launcher-win-x64.zip, which is what the installer puts at the install root
# and what the shortcuts point at. That archive is also what the manifest's "launcher"
# array points at, so an installed launcher can replace itself.
#
# ffmpeg is not part of any archive. It is GPLv3 and VidShrink is AGPL-3.0-or-later; the installer
# fetches it onto the user's machine under its own licence. See README.
#
# The asset names and the manifest format are defined in .github/workflows/manifest.md.
# The updater reads that file, not this one.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      version: ${{ steps.read.outputs.version }}
      commit: ${{ steps.read.outputs.commit }}
      built: ${{ steps.read.outputs.built }}
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - id: read
        name: Read the version from the tag and check it against the tree
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          version="${tag#v}"

          declared=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          if [ "$declared" != "$version" ]; then
            echo "Etiket $tag ile Directory.Build.props sürümü $declared uyuşmuyor." >&2
            exit 1
          fi

          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md içinde '## [$version]' başlığı yok." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Minor ve yamada ayni commit'in ci.yml kosumu yesilse suit ikinci kez kosmaz: o commit
      # zaten olculdu. Majorde (x.0.0) ya da CI yesili yoksa kapi tam kosar.
      # Yalniz .md/docs/.claude degisen commit'te ci.yml hic acilmaz; o zaman farki yalniz bu
      # yollar olan en yakin atanin yesili aranir.
      - id: tested
        name: Ayni commit'in CI yesilini ara
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.read.outputs.version }}"
          tested=false
          if [[ ! "$version" =~ ^[0-9]+\.0\.0$ ]]; then
            for c in $(git rev-list --max-count=30 HEAD); do
              other=$(git diff --name-only "$c" HEAD | grep -Ev '^(\.claude/|docs/)|\.md$' || true)
              if [ -n "$other" ]; then break; fi
              count=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=$c&status=success&per_page=1" --jq '.total_count')
              if [ "${count:-0}" -gt 0 ]; then tested=true; echo "Yesil CI: $c"; break; fi
            done
          fi
          echo "CI yesili: $tested"
          echo "tested=$tested" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    if: needs.version.outputs.tested != 'true'
    # Windows, not Linux. AppHost now picks a windowing backend per platform, so the
    # suite completes on Linux and macOS too, on Avalonia's headless backend. The gate
    # stays where the windows really open: that way the release is checked against the
    # same suite the developer sees, not a subset of it.
    runs-on: windows-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      # Tek is 75 dakikayi asiyordu. 35852667687'de ana 55 dk (toplam 3293 sn), bunun 1046 sn'si
      # alti UstSeritTik kolu; o sinif kendi parcasinda. Yerlesim denetimi uc parcada 3-5 dk;
      # ucuncu parca tumleyen suzgectir, yeni eklenen denetim metodu hicbir parcanin disinda kalmaz.
      # Ana parca ci.yml ile ayni dort harf grubuna bolundu (36035794976: 46 dk -> ~14 dk).
      matrix:
        include:
          - parca: ana-gadw
            filter: 'FullyQualifiedName~VidShrink.Tests.G|FullyQualifiedName~VidShrink.Tests.A|FullyQualifiedName~VidShrink.Tests.D|FullyQualifiedName~VidShrink.Tests.W'
            minimum: 490
            skipped: 10
          - parca: ana-k
            filter: 'FullyQualifiedName~VidShrink.Tests.K'
            minimum: 700
            skipped: 10
          - parca: ana-p
            filter: 'FullyQualifiedName~VidShrink.Tests.P'
            minimum: 220
            skipped: 10
          - parca: ana-o1
            filter: 'FullyQualifiedName~VidShrink.Tests.OynaticiM'
            minimum: 12
            skipped: 6
          - parca: ana-o2
            filter: 'FullyQualifiedName~VidShrink.Tests.O&FullyQualifiedName!~VidShrink.Tests.OynaticiM'
            minimum: 290
            skipped: 8
          - parca: ana-qs
            filter: 'FullyQualifiedName~VidShrink.Tests.Q|FullyQualifiedName~VidShrink.Tests.S'
            minimum: 440
            skipped: 10
          - parca: ana-b
            filter: 'FullyQualifiedName~VidShrink.Tests.B'
            minimum: 185
            skipped: 6
          - parca: ana-kalan
            filter: 'FullyQualifiedName!~VidShrink.Tests.G&FullyQualifiedName!~VidShrink.Tests.A&FullyQualifiedName!~VidShrink.Tests.D&FullyQualifiedName!~VidShrink.Tests.W&FullyQualifiedName!~VidShrink.Tests.K&FullyQualifiedName!~VidShrink.Tests.P&FullyQualifiedName!~VidShrink.Tests.O&FullyQualifiedName!~VidShrink.Tests.Q&FullyQualifiedName!~VidShrink.Tests.S&FullyQualifiedName!~VidShrink.Tests.B&FullyQualifiedName!~YerlesimDenetimiTests&FullyQualifiedName!~UstSeritTikTests'
            minimum: 1620
            skipped: 25
          - parca: ust-serit
            filter: 'FullyQualifiedName~UstSeritTikTests'
            minimum: 6
            skipped: 0
          - parca: yerlesim-1
            filter: 'FullyQualifiedName~YerlesimDenetimiTests.SekmelerdeKesik|FullyQualifiedName~YerlesimDenetimiTests.SonucDurumunda|FullyQualifiedName~YerlesimDenetimiTests.BosPencerede|FullyQualifiedName~YerlesimDenetimiTests.KodlamaSurerken|FullyQualifiedName~YerlesimDenetimiTests.AyrintiYuzeylerinde'
            minimum: 50
            skipped: 10
          - parca: yerlesim-2
            filter: 'FullyQualifiedName~YerlesimDenetimiTests.IzPanelinde|FullyQualifiedName~YerlesimDenetimiTests.AcilanAyrintilarda|FullyQualifiedName~YerlesimDenetimiTests.KaydediciSonucunda|FullyQualifiedName~YerlesimDenetimiTests.OynaticiKatmanlarinda|FullyQualifiedName~YerlesimDenetimiTests.OneriSeridinde'
            minimum: 50
            skipped: 10
          - parca: yerlesim-3
            filter: 'FullyQualifiedName~YerlesimDenetimiTests&FullyQualifiedName!~YerlesimDenetimiTests.SekmelerdeKesik&FullyQualifiedName!~YerlesimDenetimiTests.SonucDurumunda&FullyQualifiedName!~YerlesimDenetimiTests.BosPencerede&FullyQualifiedName!~YerlesimDenetimiTests.KodlamaSurerken&FullyQualifiedName!~YerlesimDenetimiTests.AyrintiYuzeylerinde&FullyQualifiedName!~YerlesimDenetimiTests.IzPanelinde&FullyQualifiedName!~YerlesimDenetimiTests.AcilanAyrintilarda&FullyQualifiedName!~YerlesimDenetimiTests.KaydediciSonucunda&FullyQualifiedName!~YerlesimDenetimiTests.OynaticiKatmanlarinda&FullyQualifiedName!~YerlesimDenetimiTests.OneriSeridinde'
            minimum: 50
            skipped: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # Ayni ffmpeg, ayni kapi: ci.yml ne olcuyorsa yayin da onu olcsun. ffmpeg
      # olmadan [FfmpegFact] olculeri sessizce atlaniyordu, yani yayin suiti CI'nin
      # gordugunun bir alt kumesini goruyordu.
      - name: ffmpeg kur (GyanD/codexffmpeg surum 9.0, ci.yml ile ayni)
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/GyanD/codexffmpeg/releases/download/9.0/ffmpeg-9.0-full_build.zip'
          $expectedSha256 = 'F42F0C4B04EAE3AC918707FF66E3E0FF0CEE527BFA6D322624D4BC1160D5055E'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'

          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($actual -ne $expectedSha256) {
            Write-Error "ffmpeg indirmesi sha256 uyusmuyor: beklenen=$expectedSha256 gelen=$actual"
            exit 1
          }

          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          $bin = Join-Path (Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0-full_build') 'bin'
          if (-not (Test-Path (Join-Path $bin 'ffmpeg.exe')) -or -not (Test-Path (Join-Path $bin 'ffprobe.exe'))) {
            Write-Error "ffmpeg.exe/ffprobe.exe beklenen yolda yok: $bin"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: libmpv kur (deps-libmpv-20260903 surumu, yedek shinchiro, ci.yml ile ayni)
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/Teknesyum/VidShrink/releases/download/deps-libmpv-20260903/mpv-dev-x86_64-20260903-git-69e63f425a.7z'
          $expectedSha256 = 'FAC135C68A35B7639E39D72C0C365104EDBAEBDEA39A0DFDD8C36E8C8E80FAEF'
          $expectedDllSha256 = '673E6397920AB64A9C5B3A618F7F16D38854EFE72B58665F1F84E4E873B763A4'
          $fallbackUrl = 'https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260903/mpv-dev-x86_64-20260903-git-69e63f425a.7z'
          $archive = Join-Path $env:RUNNER_TEMP 'mpv-dev.7z'

          $actual = $null
          foreach ($source in @($url, $fallbackUrl)) {
            try {
              Invoke-WebRequest -Uri $source -OutFile $archive
            } catch {
              Write-Warning "libmpv indirilemedi: $source ($($_.Exception.Message))"
              continue
            }
            $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash
            if ($actual -eq $expectedSha256) {
              Write-Host "libmpv kaynagi: $source"
              break
            }
            Write-Warning "libmpv sha256 uyusmuyor: $source beklenen=$expectedSha256 gelen=$actual"
          }
          if ($actual -ne $expectedSha256) {
            Write-Error "libmpv indirmesi sha256 uyusmuyor: beklenen=$expectedSha256 gelen=$actual"
            exit 1
          }

          $dir = Join-Path $env:RUNNER_TEMP 'libmpv'
          7z x $archive "-o$dir" -y | Out-Null
          $dll = Join-Path $dir 'libmpv-2.dll'
          if (-not (Test-Path $dll)) {
            Write-Error "libmpv-2.dll beklenen yolda yok: $dll"
            exit 1
          }
          $dllActual = (Get-FileHash -Path $dll -Algorithm SHA256).Hash
          if ($dllActual -ne $expectedDllSha256) {
            Write-Error "libmpv-2.dll sha256 uyusmuyor: beklenen=$expectedDllSha256 gelen=$dllActual"
            exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "VIDSHRINK_LIBMPV=$dll"
      # Kapi `dotnet test --no-restore` kosuyor: restore'u yapan derleme adimi olmadan
      # NETSDK1004 veriyor ve kapi bunu "Basarisiz/Failed ozeti yok" diye bildiriyor.
      # ci.yml ile ayni adim, ayni sirada.
      - run: dotnet build VidShrink.sln -c Release -warnaserror
      # Asilan bir testhost "Failed: 0" basip cikis kodu 0 dondurur. Duz `dotnet test`
      # bunu goremiyordu; yayin asilmis bir suitin uzerine yayinlanabilirdi.
      - run: pwsh -File tools/kosum-kapisi/kosum-kapisi.ps1 -MinimumTotal ${{ matrix.minimum }} -MaximumSkipped ${{ matrix.skipped }} -ResultsDir .calisma/kosum-sonuc -Filter $env:KOSUM_FILTER
        env:
          KOSUM_FILTER: ${{ matrix.filter }}
      - name: Kosum ciktisi ve hang dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosum-sonuc-yayin-${{ matrix.parca }}
          path: .calisma/kosum-sonuc/**
          if-no-files-found: ignore
          retention-days: 7

  shell-extension:
    needs: [version, test]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build the Windows 11 shell extension
        run: msbuild src/VidShrink.ShellExtension/VidShrink.ShellExtension.vcxproj /p:Configuration=Release /p:Platform=x64
      - name: Stage the sparse package files
        shell: pwsh
        run: |
          $stage = 'shell-extension'
          $assets = Join-Path $stage 'Assets'
          New-Item -ItemType Directory -Path $assets -Force | Out-Null
          Copy-Item 'src/VidShrink.ShellExtension/x64/Release/VidShrink.ShellExtension.dll' $stage
          Copy-Item 'src/VidShrink.ShellExtension/AppxManifest.template.xml' $stage
          Add-Type -AssemblyName System.Drawing
          $source = [Drawing.Image]::FromFile((Resolve-Path 'src/VidShrink.App/Assets/VidShrink.png'))
          foreach ($item in @(@('StoreLogo.png', 50), @('Square150x150Logo.png', 150), @('Square44x44Logo.png', 44))) {
            $bitmap = [Drawing.Bitmap]::new($item[1], $item[1])
            $graphics = [Drawing.Graphics]::FromImage($bitmap)
            $graphics.DrawImage($source, 0, 0, $item[1], $item[1])
            $bitmap.Save((Join-Path $assets $item[0]), [Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose()
            $bitmap.Dispose()
          }
          $source.Dispose()
      - uses: actions/upload-artifact@v4
        with:
          name: shell-extension-win-x64
          path: shell-extension/
          if-no-files-found: error

  launcher:
    # The launcher is NativeAOT: it reaches Main before a ReadyToRun single file has even
    # unpacked its runtime, and the application is born that much sooner. NativeAOT cannot
    # cross-compile from Linux to Windows, so both Windows launchers are produced here and
    # handed to the publish job as artifacts; win-arm64 uses the runner's ARM64 MSVC tools.
    needs: [version, test]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish the launcher
        shell: bash
        run: |
          dotnet publish src/VidShrink.Launcher/VidShrink.Launcher.csproj \
            -c Release -r ${{ matrix.rid }} \
            -p:Version=${{ needs.version.outputs.version }} \
            -p:SourceRevisionId=${{ needs.version.outputs.commit }} \
            -o publish-launcher
          find publish-launcher -name '*.pdb' -type f -print -delete | wc -l
          ls -la publish-launcher
          test -f publish-launcher/VidShrink.exe
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.rid }}
          path: publish-launcher/
          if-no-files-found: error

  publish:
    needs: [version, test, shell-extension, launcher]
    if: ${{ !cancelled() && needs.shell-extension.result == 'success' && needs.launcher.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Self-contained publish needs no target machine: all six are produced on the
        # Linux runner. zip is used rather than actions/upload-artifact's own packing
        # because it keeps the executable bit on the macOS and Linux binaries.
        rid: [win-x64, win-arm64, osx-arm64, osx-x64, linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish the command line
        # The headless CLI ships beside the application in the same folder and archive, so it
        # updates with it and never updates itself. It goes first: the application publish
        # that follows overwrites the shared assemblies with its ReadyToRun builds. On macOS
        # the executable is vidshrink-cli, because the bundle's VidShrink host would collide
        # with vidshrink on a case-insensitive volume.
        run: |
          dotnet publish src/VidShrink.Cli/VidShrink.Cli.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained \
            -p:Version=${{ needs.version.outputs.version }} \
            -p:SourceRevisionId=${{ needs.version.outputs.commit }} \
            -o publish/${{ matrix.rid }}

      - name: Publish
        run: |
          dotnet publish src/VidShrink.App/VidShrink.App.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained \
            -p:Version=${{ needs.version.outputs.version }} \
            -p:SourceRevisionId=${{ needs.version.outputs.commit }} \
            -o publish/${{ matrix.rid }}

      - name: Fetch the launcher
        # Windows only, both architectures. The launcher is what the shortcuts point at and
        # what applies an update before the application is loaded; without it in the release
        # the installer has nowhere to get it from. It is NativeAOT, built by the launcher job
        # on a Windows runner, so win-arm64 gets its own native launcher rather than an emulated one.
        if: startsWith(matrix.rid, 'win-')
        uses: actions/download-artifact@v4
        with:
          name: launcher-${{ matrix.rid }}
          path: publish-launcher

      - name: Publish the setup program
        # Windows only. VidShrink-Setup.exe is a trimmed single-file console program that
        # does what Install-VidShrink.ps1 does without starting PowerShell: it downloads the
        # two archives in parallel, checks them against checksums-<rid>.txt and unpacks them
        # straight into the install root. It is not listed in the manifest; the updater never
        # replaces it, a user runs it once. It stays x64 and is published once: Windows on ARM
        # runs an x64 console program under emulation, and the program reads the machine's own
        # architecture (RuntimeInformation.OSArchitecture is Arm64 even under emulation), so a
        # single VidShrink-Setup.exe installs the win-arm64 release on an arm64 machine.
        if: matrix.rid == 'win-x64'
        run: |
          dotnet publish src/VidShrink.Setup/VidShrink.Setup.csproj \
            -c Release \
            -p:Version=${{ needs.version.outputs.version }} \
            -p:SourceRevisionId=${{ needs.version.outputs.commit }} \
            -o publish-setup

      # The Windows 11 shell extension is a native COM DLL and is built for x64 only, so it
      # travels in the win-x64 launcher archive alone. On win-arm64 the launcher archive
      # carries no shell/ folder and the manifest's "shell" array comes out empty; the
      # classic context menu (ShellMenu.cs) still works there.
      - uses: actions/download-artifact@v4
        if: matrix.rid == 'win-x64'
        with:
          name: shell-extension-win-x64
          path: publish-launcher/shell

      - name: Drop the debug symbols
        # Measured on 12 Sep 2026 against the published 0.4.1 manifest: the six .pdb
        # files weigh 100.45 MB of a 205.22 MB payload, and libSkiaSharp.pdb alone is
        # 84 MB. An install at 0.3.0 has none of them, so the differ counted them as
        # missing and tried to fetch 134.8 MB on every launch. End users have no use for
        # symbols. DebugType cannot reach the ones that arrive inside native packages,
        # so they are deleted from the publish folder instead — before the manifest is
        # written, so neither the manifest nor the archive lists them.
        run: |
          set -euo pipefail
          find publish -name '*.pdb' -type f -print -delete | wc -l
          if [ -d publish-launcher ]; then
            find publish-launcher -name '*.pdb' -type f -print -delete | wc -l
          fi

      - name: Write manifest.json
        # The manifest tool is a CI helper and is not in VidShrink.sln, so it is built
        # from its own project file.
        run: |
          set -euo pipefail
          dotnet build tools/VidShrink.Manifest/VidShrink.Manifest.csproj -c Release
          tool=tools/VidShrink.Manifest/bin/Release/net8.0/vidshrink-manifest.dll
          dotnet $tool write \
            publish/${{ matrix.rid }} \
            --version ${{ needs.version.outputs.version }} \
            --rid ${{ matrix.rid }} \
            --commit ${{ needs.version.outputs.commit }} \
            --built ${{ needs.version.outputs.built }}

          # The launcher is counted by the same manifest, in its own top-level "launcher"
          # array rather than among "files". Two reasons for a separate field over a path
          # prefix inside "files": the rows are rooted at the install root, not at app/,
          # and every launcher already installed would look for a prefixed path inside
          # vidshrink-<rid>.zip, not find it, and give up on the whole update. An unknown
          # top-level field is simply ignored by those older clients, so they keep
          # updating app/ exactly as before.
          #
          # Only VidShrink.exe is listed under "launcher", and the name is pinned by a
          # test against LauncherUpdate.ExecutableName. The .pdb that used to sit beside
          # it in the archive is gone: the step above deletes every symbol file.
          #
          # The shell/ folder next to it goes into a second top-level array, "shell". Those
          # files live at the install root like the launcher, and travel in the same launcher
          # archive, but no running process holds them, so they are copied straight over
          # rather than going through the rename-on-exit swap. Before this array existed the
          # folder shipped in the archive and was picked up by a fresh install, while an
          # install that arrived through the updater never received it: the updater only
          # swaps the rows the manifest lists. Older clients ignore the unknown field.
          if [ -d publish-launcher ]; then
            dotnet $tool write publish-launcher \
              --version ${{ needs.version.outputs.version }} \
              --rid ${{ matrix.rid }} \
              --commit ${{ needs.version.outputs.commit }} \
              --built ${{ needs.version.outputs.built }} \
              --out launcher-manifest.json
            jq --slurpfile launcher launcher-manifest.json \
              '.launcher = ($launcher[0].files | map(select(.path == "VidShrink.exe")))
               | .shell = ($launcher[0].files | map(select(.path | startswith("shell/"))))' \
              publish/${{ matrix.rid }}/manifest.json > merged-manifest.json
            mv merged-manifest.json publish/${{ matrix.rid }}/manifest.json
            jq -r '.launcher[] | "manifest launcher: \(.path) \(.size)"' publish/${{ matrix.rid }}/manifest.json
            jq -r '.shell[] | "manifest shell: \(.path) \(.size)"' publish/${{ matrix.rid }}/manifest.json
          fi

      - name: Archive, copy the manifest out, checksum both
        run: |
          set -euo pipefail
          mkdir -p assets
          ( cd publish/${{ matrix.rid }} && zip -qr "$GITHUB_WORKSPACE/assets/vidshrink-${{ matrix.rid }}.zip" . )
          # The same bytes ship twice: inside the archive as manifest.json, and beside it
          # as a standalone asset the updater can fetch without downloading the archive.
          cp publish/${{ matrix.rid }}/manifest.json assets/manifest-${{ matrix.rid }}.json

          checksummed="vidshrink-${{ matrix.rid }}.zip manifest-${{ matrix.rid }}.json"
          # The launcher travels as its own archive rather than inside the application
          # archive: the archive is what the updater unpacks over app/, and the launcher
          # does not live there. The manifest's "launcher" array points at this archive,
          # so the updater range-fetches VidShrink.exe out of it without the application
          # archive having to carry a second copy of the binary.
          if [ -d publish-launcher ]; then
            ( cd publish-launcher && zip -qr "$GITHUB_WORKSPACE/assets/vidshrink-launcher-${{ matrix.rid }}.zip" . )
            checksummed="$checksummed vidshrink-launcher-${{ matrix.rid }}.zip"
          fi
          if [ -f publish-setup/VidShrink-Setup.exe ]; then
            cp publish-setup/VidShrink-Setup.exe assets/VidShrink-Setup.exe
            checksummed="$checksummed VidShrink-Setup.exe"
          fi
          ( cd assets && sha256sum $checksummed > "checksums-${{ matrix.rid }}.txt" )
          cat assets/checksums-${{ matrix.rid }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.rid }}
          path: assets/
          if-no-files-found: error

  release:
    needs: [version, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          pattern: assets-*
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l downloaded
          gh release create "${{ needs.version.outputs.tag }}" \
            --draft \
            --title "VidShrink ${{ needs.version.outputs.version }}" \
            --notes "CHANGELOG.md içindeki ${{ needs.version.outputs.version }} bölümüne bakın." \
            downloaded/*

      # The release is created as a draft so no client sees it half-uploaded, then published
      # here once every asset is in place. It is not left as a draft: an installed launcher
      # reads its manifest from releases/latest/download and a draft is invisible there, so a
      # draft release ships to nobody until someone remembers to publish it by hand.
      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.tag }}"
          gh release edit "$tag" --draft=false --latest
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            gh release view "$tag" --json assets --jq ".assets[].name" | grep -qx "manifest-$rid.json"
          done
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "false"

  # arm64 dogrulamasi: yalniz elle tetiklenir, etiket ve yayin olusturmaz. arm64 artik etiket
  # matrisinde de var (publish isi); bu is surum kesmeden ayni paketi uretip gercek arm64
  # kosucusunda actirmak icin duruyor.
  arm64-publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        arm: [win-arm64, linux-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - id: read
        run: |
          set -euo pipefail
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Publish the command line and the application
        run: |
          set -euo pipefail
          for project in src/VidShrink.Cli/VidShrink.Cli.csproj src/VidShrink.App/VidShrink.App.csproj; do
            dotnet publish "$project" \
              -c Release -r ${{ matrix.arm }} --self-contained \
              -p:Version=${{ steps.read.outputs.version }} \
              -p:SourceRevisionId=${{ steps.read.outputs.commit }} \
              -o publish/${{ matrix.arm }}
          done
          find publish -name '*.pdb' -type f -delete

      - name: Write manifest.json, archive, checksum
        run: |
          set -euo pipefail
          dotnet build tools/VidShrink.Manifest/VidShrink.Manifest.csproj -c Release
          dotnet tools/VidShrink.Manifest/bin/Release/net8.0/vidshrink-manifest.dll write \
            publish/${{ matrix.arm }} \
            --version ${{ steps.read.outputs.version }} \
            --rid ${{ matrix.arm }} \
            --commit ${{ steps.read.outputs.commit }} \
            --built ${{ steps.read.outputs.built }}
          mkdir -p assets
          ( cd publish/${{ matrix.arm }} && zip -qr "$GITHUB_WORKSPACE/assets/vidshrink-${{ matrix.arm }}.zip" . )
          cp publish/${{ matrix.arm }}/manifest.json assets/manifest-${{ matrix.arm }}.json
          ( cd assets && sha256sum vidshrink-${{ matrix.arm }}.zip manifest-${{ matrix.arm }}.json > "checksums-${{ matrix.arm }}.txt" )
          cat assets/checksums-${{ matrix.arm }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: arm64-assets-${{ matrix.arm }}
          path: assets/
          if-no-files-found: error
          retention-days: 7

  arm64-verify:
    needs: arm64-publish
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: win-arm64
            os: windows-11-arm
          - arm: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arm64-assets-${{ matrix.arm }}
          path: assets

      - name: Checksum, unpack, start headless (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location assets
          foreach ($line in Get-Content "checksums-${{ matrix.arm }}.txt") {
            $sha, $name = $line -split '\s+', 2
            $actual = (Get-FileHash $name.TrimStart('*') -Algorithm SHA256).Hash
            if ($actual -ne $sha.ToUpperInvariant()) { throw "sha256 uyusmuyor: $name" }
          }
          Expand-Archive "vidshrink-${{ matrix.arm }}.zip" -DestinationPath app
          "kosucu mimarisi: $env:PROCESSOR_ARCHITECTURE $([Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          foreach ($pe in @('app/vidshrink.exe', 'app/VidShrink.App.exe', 'app/libSkiaSharp.dll')) {
            if (-not (Test-Path $pe)) { Write-Host "$pe yok"; continue }
            $b = [IO.File]::ReadAllBytes((Resolve-Path $pe).Path)
            $off = [BitConverter]::ToInt32($b, 0x3C)
            $machine = [BitConverter]::ToUInt16($b, $off + 4)
            "PE makine $pe = 0x{0:X4}" -f $machine
            if ($machine -ne 0xAA64) { throw "$pe arm64 degil" }
          }
          $v = & app/vidshrink.exe --version
          if ($LASTEXITCODE -ne 0) { throw "vidshrink --version cikis $LASTEXITCODE" }
          "vidshrink --version: $v"

      - name: Checksum, unpack, start headless (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          cd assets
          sha256sum -c "checksums-${{ matrix.arm }}.txt"
          unzip -q "vidshrink-${{ matrix.arm }}.zip" -d app
          echo "kosucu mimarisi: $(uname -m)"
          file app/vidshrink app/VidShrink.App app/libSkiaSharp.so
          file app/vidshrink | grep -q aarch64
          chmod +x app/vidshrink app/VidShrink.App
          echo "vidshrink --version: $(app/vidshrink --version)"
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc2=size=640x360:rate=30 -t 3 -pix_fmt yuv420p -c:v libx264 kaynak.mp4
          app/vidshrink plan kaynak.mp4 --hedef 1 --olcumsuz --json > plan.json
          grep -E '"(codec|videoBitrateK|targetMb)"' plan.json

  # Kurucunun arm64 bagimlilik kolu gercek bir arm64 kosucusunda kosuyor: ffmpeg ve libmpv
  # pinli adreslerden inip sha256'lari dogrulaniyor, ffmpeg kendi mimarisini basiyor, libmpv
  # surece yukleniyor. Negatif kontrol ayni komutu bozuk bir sha256 ile kosuyor: dogrulama
  # durdurmazsa kol yesil kalirdi ve pin bir sey olcmuyor olurdu.
  arm64-deps:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-11-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Kurucunun bagimlilik kolu (ffmpeg + libmpv, sha256)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "kosucu mimarisi: $env:PROCESSOR_ARCHITECTURE $([Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
          & ./Install-VidShrink.ps1 -DepsOnly "$env:RUNNER_TEMP/deps"

          $ffmpeg = Join-Path $env:RUNNER_TEMP 'deps/ffmpeg/ffmpeg.exe'
          $dll = Join-Path $env:RUNNER_TEMP 'deps/libmpv/libmpv-2.dll'
          foreach ($pe in @($ffmpeg, $dll)) {
            $b = [IO.File]::ReadAllBytes((Resolve-Path $pe).Path)
            $off = [BitConverter]::ToInt32($b, 0x3C)
            $machine = [BitConverter]::ToUInt16($b, $off + 4)
            "PE makine $pe = 0x{0:X4}" -f $machine
            if ($machine -ne 0xAA64) { throw "$pe arm64 degil" }
          }

          $version = (& $ffmpeg -hide_banner -version) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg -version cikis $LASTEXITCODE" }
          ($version -split "`n")[0]
          $handle = [Runtime.InteropServices.NativeLibrary]::Load((Resolve-Path $dll).Path)
          "libmpv yuklendi: 0x{0:X}" -f [int64]$handle

      - name: "Negatif kontrol: bozuk sha256 kurulumu durduruyor"
        shell: pwsh
        run: |
          $hata = $null
          try {
            & ./Install-VidShrink.ps1 -DepsOnly "$env:RUNNER_TEMP/deps-bozuk" -DepsSha256Override ('0' * 64)
          }
          catch {
            $hata = $_.Exception.Message
          }
          if (-not $hata) { throw 'bozuk sha256 ile kol yesil dondu' }
          if ($hata -notmatch 'tutmuyor') { throw "beklenen sha256 hatasi degil: $hata" }
          "negatif kontrol ayirdi: $hata"

  # A tag whose release run goes red publishes nothing, and nothing says so: installed
  # copies keep following releases/latest and sit on the previous version. That is what
  # happened to 0.5.0 and 0.5.1 on 13 September 2026 - both tags exist, neither shipped an
  # asset, and the desktop stayed on 0.4.5 until 0.5.2 landed. This job turns that silence
  # into a push.
  alarm:
    needs: [version, test, shell-extension, publish, release]
    if: ${{ !cancelled() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - name: Push to phone
        if: env.TOPIC != ''
        run: |
          curl -sS \
            -H "Title: VidShrink ${{ github.ref_name }} yayinlanmadi" \
            -H "Priority: urgent" \
            -H "Tags: rotating_light" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Etiket itildi, release kosumu kirmizi. Kurulu kopyalar eski surumde kaliyor." \
            "https://ntfy.sh/$TOPIC"
