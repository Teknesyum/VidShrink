name: release

# Runs when a version tag is pushed. Publishes VidShrink self-contained for the four
# supported targets, writes a per-file manifest next to each archive, and collects
# everything into a GitHub Release, published as latest once every asset is uploaded.
# win-x64 additionally carries the launcher as
# vidshrink-launcher-win-x64.zip, which is what the installer puts at the install root
# and what the shortcuts point at. That archive is also what the manifest's "launcher"
# array points at, so an installed launcher can replace itself.
#
# ffmpeg is not part of any archive. It is GPLv3 and VidShrink is AGPL-3.0-or-later; the installer
# fetches it onto the user's machine under its own licence. See README.
#
# The asset names and the manifest format are defined in .github/workflows/manifest.md.
# The updater reads that file, not this one.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.read.outputs.tag }}
      version: ${{ steps.read.outputs.version }}
      commit: ${{ steps.read.outputs.commit }}
      built: ${{ steps.read.outputs.built }}
    steps:
      - uses: actions/checkout@v4

      - id: read
        name: Read the version from the tag and check it against the tree
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          version="${tag#v}"

          declared=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
          if [ "$declared" != "$version" ]; then
            echo "Etiket $tag ile Directory.Build.props sürümü $declared uyuşmuyor." >&2
            exit 1
          fi

          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md içinde '## [$version]' başlığı yok." >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    # Windows, not Linux. AppHost now picks a windowing backend per platform, so the
    # suite completes on Linux and macOS too, on Avalonia's headless backend. The gate
    # stays where the windows really open: that way the release is checked against the
    # same suite the developer sees, not a subset of it.
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # Ayni ffmpeg, ayni kapi: ci.yml ne olcuyorsa yayin da onu olcsun. ffmpeg
      # olmadan [FfmpegFact] olculeri sessizce atlaniyordu, yani yayin suiti CI'nin
      # gordugunun bir alt kumesini goruyordu.
      - name: ffmpeg kur (GyanD/codexffmpeg surum 9.0, ci.yml ile ayni)
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/GyanD/codexffmpeg/releases/download/9.0/ffmpeg-9.0-full_build.zip'
          $expectedSha256 = 'F42F0C4B04EAE3AC918707FF66E3E0FF0CEE527BFA6D322624D4BC1160D5055E'
          $zip = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'

          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          if ($actual -ne $expectedSha256) {
            Write-Error "ffmpeg indirmesi sha256 uyusmuyor: beklenen=$expectedSha256 gelen=$actual"
            exit 1
          }

          Expand-Archive -Path $zip -DestinationPath $env:RUNNER_TEMP -Force
          $bin = Join-Path (Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0-full_build') 'bin'
          if (-not (Test-Path (Join-Path $bin 'ffmpeg.exe')) -or -not (Test-Path (Join-Path $bin 'ffprobe.exe'))) {
            Write-Error "ffmpeg.exe/ffprobe.exe beklenen yolda yok: $bin"
            exit 1
          }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: libmpv kur (shinchiro mpv-winbuild-cmake 20260903, ci.yml ile ayni)
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20260903/mpv-dev-x86_64-20260903-git-69e63f425a.7z'
          $expectedSha256 = 'FAC135C68A35B7639E39D72C0C365104EDBAEBDEA39A0DFDD8C36E8C8E80FAEF'
          $expectedDllSha256 = '673E6397920AB64A9C5B3A618F7F16D38854EFE72B58665F1F84E4E873B763A4'
          $archive = Join-Path $env:RUNNER_TEMP 'mpv-dev.7z'

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash
          if ($actual -ne $expectedSha256) {
            Write-Error "libmpv indirmesi sha256 uyusmuyor: beklenen=$expectedSha256 gelen=$actual"
            exit 1
          }

          $dir = Join-Path $env:RUNNER_TEMP 'libmpv'
          7z x $archive "-o$dir" -y | Out-Null
          $dll = Join-Path $dir 'libmpv-2.dll'
          if (-not (Test-Path $dll)) {
            Write-Error "libmpv-2.dll beklenen yolda yok: $dll"
            exit 1
          }
          $dllActual = (Get-FileHash -Path $dll -Algorithm SHA256).Hash
          if ($dllActual -ne $expectedDllSha256) {
            Write-Error "libmpv-2.dll sha256 uyusmuyor: beklenen=$expectedDllSha256 gelen=$dllActual"
            exit 1
          }
          Add-Content -Path $env:GITHUB_ENV -Value "VIDSHRINK_LIBMPV=$dll"
      # Asilan bir testhost "Failed: 0" basip cikis kodu 0 dondurur. Duz `dotnet test`
      # bunu goremiyordu; yayin asilmis bir suitin uzerine yayinlanabilirdi.
      - run: pwsh -File tools/kosum-kapisi/kosum-kapisi.ps1 -MinimumTotal 1143 -MaximumSkipped 30 -ResultsDir .calisma/kosum-sonuc
      - name: Kosum ciktisi ve hang dump
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kosum-sonuc-yayin
          path: .calisma/kosum-sonuc/**
          if-no-files-found: ignore
          retention-days: 7

  shell-extension:
    needs: [version, test]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build the Windows 11 shell extension
        run: msbuild src/VidShrink.ShellExtension/VidShrink.ShellExtension.vcxproj /p:Configuration=Release /p:Platform=x64
      - name: Stage the sparse package files
        shell: pwsh
        run: |
          $stage = 'shell-extension'
          $assets = Join-Path $stage 'Assets'
          New-Item -ItemType Directory -Path $assets -Force | Out-Null
          Copy-Item 'src/VidShrink.ShellExtension/x64/Release/VidShrink.ShellExtension.dll' $stage
          Copy-Item 'src/VidShrink.ShellExtension/AppxManifest.template.xml' $stage
          Add-Type -AssemblyName System.Drawing
          $source = [Drawing.Image]::FromFile((Resolve-Path 'src/VidShrink.App/Assets/VidShrink.png'))
          foreach ($item in @(@('StoreLogo.png', 50), @('Square150x150Logo.png', 150), @('Square44x44Logo.png', 44))) {
            $bitmap = [Drawing.Bitmap]::new($item[1], $item[1])
            $graphics = [Drawing.Graphics]::FromImage($bitmap)
            $graphics.DrawImage($source, 0, 0, $item[1], $item[1])
            $bitmap.Save((Join-Path $assets $item[0]), [Drawing.Imaging.ImageFormat]::Png)
            $graphics.Dispose()
            $bitmap.Dispose()
          }
          $source.Dispose()
      - uses: actions/upload-artifact@v4
        with:
          name: shell-extension-win-x64
          path: shell-extension/
          if-no-files-found: error

  publish:
    needs: [version, test, shell-extension]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Self-contained publish needs no target machine: all four are produced on the
        # Linux runner. zip is used rather than actions/upload-artifact's own packing
        # because it keeps the executable bit on the macOS and Linux binaries.
        rid: [win-x64, osx-arm64, osx-x64, linux-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        run: |
          dotnet publish src/VidShrink.App/VidShrink.App.csproj \
            -c Release -r ${{ matrix.rid }} --self-contained \
            -p:Version=${{ needs.version.outputs.version }} \
            -p:SourceRevisionId=${{ needs.version.outputs.commit }} \
            -o publish/${{ matrix.rid }}

      - name: Publish the launcher
        # Windows only. The launcher is what the shortcuts point at and what applies an
        # update before the application is loaded; without it in the release the installer
        # has nowhere to get it from. Its runtime identifier is fixed in the csproj.
        if: matrix.rid == 'win-x64'
        run: |
          dotnet publish src/VidShrink.Launcher/VidShrink.Launcher.csproj \
            -c Release \
            -p:Version=${{ needs.version.outputs.version }} \
            -p:SourceRevisionId=${{ needs.version.outputs.commit }} \
            -o publish-launcher

      - uses: actions/download-artifact@v4
        if: matrix.rid == 'win-x64'
        with:
          name: shell-extension-win-x64
          path: publish-launcher/shell

      - name: Write manifest.json
        # The manifest tool is a CI helper and is not in VidShrink.sln, so it is built
        # from its own project file.
        run: |
          set -euo pipefail
          dotnet build tools/VidShrink.Manifest/VidShrink.Manifest.csproj -c Release
          tool=tools/VidShrink.Manifest/bin/Release/net8.0/vidshrink-manifest.dll
          dotnet $tool write \
            publish/${{ matrix.rid }} \
            --version ${{ needs.version.outputs.version }} \
            --rid ${{ matrix.rid }} \
            --commit ${{ needs.version.outputs.commit }} \
            --built ${{ needs.version.outputs.built }}

          # The launcher is counted by the same manifest, in its own top-level "launcher"
          # array rather than among "files". Two reasons for a separate field over a path
          # prefix inside "files": the rows are rooted at the install root, not at app/,
          # and every launcher already installed would look for a prefixed path inside
          # vidshrink-<rid>.zip, not find it, and give up on the whole update. An unknown
          # top-level field is simply ignored by those older clients, so they keep
          # updating app/ exactly as before.
          #
          # Only VidShrink.exe is listed under "launcher". The .pdb beside it is in the
          # archive but is not part of the swap, and the name is pinned by a test against
          # LauncherUpdate.ExecutableName.
          #
          # The shell/ folder next to it goes into a second top-level array, "shell". Those
          # files live at the install root like the launcher, and travel in the same launcher
          # archive, but no running process holds them, so they are copied straight over
          # rather than going through the rename-on-exit swap. Before this array existed the
          # folder shipped in the archive and was picked up by a fresh install, while an
          # install that arrived through the updater never received it: the updater only
          # swaps the rows the manifest lists. Older clients ignore the unknown field.
          if [ -d publish-launcher ]; then
            dotnet $tool write publish-launcher \
              --version ${{ needs.version.outputs.version }} \
              --rid ${{ matrix.rid }} \
              --commit ${{ needs.version.outputs.commit }} \
              --built ${{ needs.version.outputs.built }} \
              --out launcher-manifest.json
            jq --slurpfile launcher launcher-manifest.json \
              '.launcher = ($launcher[0].files | map(select(.path == "VidShrink.exe")))
               | .shell = ($launcher[0].files | map(select(.path | startswith("shell/"))))' \
              publish/${{ matrix.rid }}/manifest.json > merged-manifest.json
            mv merged-manifest.json publish/${{ matrix.rid }}/manifest.json
            jq -r '.launcher[] | "manifest launcher: \(.path) \(.size)"' publish/${{ matrix.rid }}/manifest.json
            jq -r '.shell[] | "manifest shell: \(.path) \(.size)"' publish/${{ matrix.rid }}/manifest.json
          fi

      - name: Archive, copy the manifest out, checksum both
        run: |
          set -euo pipefail
          mkdir -p assets
          ( cd publish/${{ matrix.rid }} && zip -qr "$GITHUB_WORKSPACE/assets/vidshrink-${{ matrix.rid }}.zip" . )
          # The same bytes ship twice: inside the archive as manifest.json, and beside it
          # as a standalone asset the updater can fetch without downloading the archive.
          cp publish/${{ matrix.rid }}/manifest.json assets/manifest-${{ matrix.rid }}.json

          checksummed="vidshrink-${{ matrix.rid }}.zip manifest-${{ matrix.rid }}.json"
          # The launcher travels as its own archive rather than inside the application
          # archive: the archive is what the updater unpacks over app/, and the launcher
          # does not live there. The manifest's "launcher" array points at this archive,
          # so the updater range-fetches VidShrink.exe out of it without the application
          # archive having to carry a second copy of the binary.
          if [ -d publish-launcher ]; then
            ( cd publish-launcher && zip -qr "$GITHUB_WORKSPACE/assets/vidshrink-launcher-${{ matrix.rid }}.zip" . )
            checksummed="$checksummed vidshrink-launcher-${{ matrix.rid }}.zip"
          fi
          ( cd assets && sha256sum $checksummed > "checksums-${{ matrix.rid }}.txt" )
          cat assets/checksums-${{ matrix.rid }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.rid }}
          path: assets/
          if-no-files-found: error

  release:
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloaded
          pattern: assets-*
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l downloaded
          gh release create "${{ needs.version.outputs.tag }}" \
            --draft \
            --title "VidShrink ${{ needs.version.outputs.version }}" \
            --notes "CHANGELOG.md içindeki ${{ needs.version.outputs.version }} bölümüne bakın." \
            downloaded/*

      # The release is created as a draft so no client sees it half-uploaded, then published
      # here once every asset is in place. It is not left as a draft: an installed launcher
      # reads its manifest from releases/latest/download and a draft is invisible there, so a
      # draft release ships to nobody until someone remembers to publish it by hand.
      - name: Publish it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.version.outputs.tag }}"
          gh release edit "$tag" --draft=false --latest
          for rid in win-x64 linux-x64 osx-x64 osx-arm64; do
            gh release view "$tag" --json assets --jq ".assets[].name" | grep -qx "manifest-$rid.json"
          done
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = "false"
